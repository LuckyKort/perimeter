name: Release

on:
  push:
    tags: ["v*"]

# Actions are pinned to commit hashes: a moved tag can't change what runs here.
permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: VERSION=${GITHUB_REF_NAME} REPO=${GITHUB_REPOSITORY} ./scripts/build-mac.sh
      # Signed build provenance: anyone can check a file was built here, from this commit:
      #   gh attestation verify <file> --repo LuckyKort/perimeter
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Perimeter-macos.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/Perimeter-macos.zip

  windows-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: VERSION=${GITHUB_REF_NAME} REPO=${GITHUB_REPOSITORY} ./scripts/build-windows.sh
      - name: Linux
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v} -X perimeter/internal/app.Repo=${GITHUB_REPOSITORY}" -o perimeter ./cmd/perimeter
            tar -czf dist/perimeter-linux-$arch.tar.gz perimeter
          done
      - run: ./scripts/build-extension.sh
      # Signed build provenance: anyone can check a file was built here, from this commit:
      #   gh attestation verify <file> --repo LuckyKort/perimeter
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.tar.gz
            dist/perimeter-extension.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-linux
          path: |
            dist/*.exe
            dist/*.tar.gz
            dist/perimeter-extension.zip

  release:
    needs: [macos, windows-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ./scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Perimeter ${GITHUB_REF_NAME}" --notes-file notes.md
